## YAML

[[repos]]
repo = "https://github.com/google/yamlfmt"
rev = "v0.19.0"
hooks = [
  { id = "yamlfmt", exclude = { glob = [
    "**/.yamllint.yaml",
    "_data/news.yml",
  ] } },
]

[[repos]]
repo = "https://github.com/adrienverge/yamllint.git"
rev = "v1.29.0"
hooks = [{ id = "yamllint" }]
