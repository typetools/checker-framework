# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs", exclude = { glob = [
    "search",
  ] } },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks", exclude = { glob = [
    ".subversion/auth",
    "dots/.subversion/auth",
  ] } },
  { id = "check-toml" },
  { id = "check-vcs-permalinks" },
  { id = "check-xml", exclude = { glob = [
    "posts/rss.xml",
    "blog/feed.xml",
  ] } },
  { id = "check-yaml" },
  { id = "destroyed-symlinks" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer", exclude = { glob = [
    "**/*.diff",
    "**/*.diff3",
    "**/*.ics",
    "**/*.key",
    "**/*.patch",
    "**/*.pdf",
    "**/*.pdf-*",
    "**/*.ppt",
    "**/*.pptx",
    "**/*.ps",
    "**/*.ps-*",
    "**/*.svg",
    "**/.vscode/settings.json",
    "**/expected*",
    "**/native-image/**",
    "**/non-conflicted-file-without-terminator.txt",
    "**/tests/squeeze-blank-lines-test/**",
    "bugs/jikes-patches/*",
  ] } },
  { id = "fix-byte-order-marker" },
  { id = "forbid-new-submodules" },
  { id = "mixed-line-ending", exclude = { glob = [
    "**/*.ps",
    "**/*.ps-*",
  ] } },
  { id = "trailing-whitespace", exclude = { glob = [
    "**/*.diff",
    "**/*.diff3",
    "**/*.goal",
    "**/*.ics",
    "**/*.key",
    "**/*.patch",
    "**/*.pdf",
    "**/*.pdf-*",
    "**/*.ppt",
    "**/*.pptx",
    "**/*.ps",
    "**/*.ps-*",
    "**/*.svg",
    "**/tests/squeeze-blank-lines-test/**",
    ".aspell.en.prepl",
    ".aspell.en.pws",
    "bugs/BUGS.to-do",
    "bugs/bug-mew",
    "bugs/jikes-patches/*",
    "dots/.aspell.en.prepl",
    "dots/.aspell.en.pws",
    "dots/en_US_apostrophe.aff",
    "dots/enscript.st",
    "emacs/bug/crypted.UUE",
    "en_US_apostrophe.aff",
    "enscript.st",
  ] } },
]

## GitHub Actions

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint" }]

## HTML

[[repos]]
repo = "https://github.com/Lucas-C/pre-commit-hooks-java"
rev = "1.3.10"
hooks = [
  { id = "validate-html", exclude = { glob = [
    "**/bytopic-headfoot.html",
    "google04aaa4eb05fd668b.html",
    "**/pubs-bytopic-underreview-headfoot.html",
    "**/pubs-bytopic-headfoot.html",
  ] } },
]

## Makefiles

[[repos]]
repo = "https://github.com/checkmake/checkmake.git"
rev = "0.2.2"
hooks = [
  { id = "checkmake", args = [
    "--format={{.FileName}}:{{.LineNumber}}:0: {{.Rule}}: {{.Violation}}\n",
  ], exclude = { glob = [
    "code-style.Makefile",
  ] } },
]

## Markdown

[[repos]]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "v0.23.1"
hooks = [{ id = "markdownlint-cli2" }]

## Pre-commit itself

[[repos]]
repo = "https://github.com/pre-commit/sync-pre-commit-deps"
rev = "v0.0.4"
hooks = [{ id = "sync-pre-commit-deps" }]

## Python

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.22"
hooks = [
  # Run the linter.
  { id = "ruff-check", args = ["--fix"], types_or = ["python", "pyi"] },

  # Run the formatter.
  { id = "ruff-format", types_or = ["python", "pyi"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.63"
hooks = [{ id = "ty", types_or = ["python", "pyi"] }]

[[repos]]
repo = "https://github.com/asottile/pyupgrade"
rev = "v3.21.2"
hooks = [{ id = "pyupgrade" }]

## Secrets

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.24.2"
hooks = [
  { id = "gitleaks", exclude = { glob = [
    "**/AdjacentTest*",
    "**/*.ps",
  ] } },
]

[[repos]]
repo = "https://github.com/Yelp/detect-secrets"
rev = "v1.5.0"
hooks = [
  { id = "detect-secrets", exclude = { glob = [
    "**/*.ps",
    "**/AdjacentTest*",
    "_layouts/schedule.html",
    "_posts/2025-05-29-managing-research-data.md",
  ] } },
]

## Shell scripts

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [
  { id = "shellcheck", args = [
    "-x",
    "-P",
    "SCRIPTDIR",
  ], exclude = { glob = [
    "share/csail-athena-tickets.bash",
    "share/addrfilter",
    "share/print-mail",
    "share/javapp",
    "share/myxapps",
    "cronic-orig",
    "classfile_check_version",
  ] } },
]

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.13.1-1"
hooks = [
  { id = "shfmt", args = [
    "-i",
    "2",
    "-ci",
    "-bn",
    "-sr",
  ], exclude = { glob = [
    "gradlew",
    "share/addrfilter",
    "dots/conda-initialize.sh",
    "conda-initialize.sh",
  ] } },
]

