[versions]

# If you update errorprone-version:
#  * Temporarily comment out "-Werror" in build.gradle files.
#  * Repeatedly run `./gradlew clean compileJava` and fix all errors.
#  * Uncomment "-Werror".
errorprone-version = "2.50.0"

junit-junit = "4.13.2"

jgit-version = "7.7.1.202607240634-r"

[libraries]

# This line might need to be updated by hand, because sometimes the artifact
# name itself changes (independently of the version number), such as from
# org.apache.spark:spark-sql_2.12 to org.apache.spark:spark-sql_2.13.
# See https://mvnrepository.com/artifact/org.apache.spark/spark-sql .
spark-sql = "org.apache.spark:spark-sql_2.13:4.2.0"

asm = "org.ow2.asm:asm:9.10.1"

auto-value = "com.google.auto.value:auto-value:1.11.1"

auto-value-annotations = "com.google.auto.value:auto-value-annotations:1.11.1"

auto-value-parcel = "com.ryanharter.auto.value:auto-value-parcel:0.2.9"

aws-java-sdk-bom = "com.amazonaws:aws-java-sdk-bom:1.12.797"

aws-java-sdk-ec2 = { module = "com.amazonaws:aws-java-sdk-ec2" }

aws-java-sdk-kms = { module = "com.amazonaws:aws-java-sdk-kms" }

classgraph = "io.github.classgraph:classgraph:4.8.192"

commons-io = "commons-io:commons-io:2.22.0"

error-prone-annotations = { group = "com.google.errorprone", name = "error_prone_annotations", version.ref = "errorprone-version" }

error-prone-core = { group = "com.google.errorprone", name = "error_prone_core", version.ref = "errorprone-version" }

google-java-format = "com.google.googlejavaformat:google-java-format:1.36.1"

guava = "org.checkerframework.annotatedlib:guava:33.1.0.2-jre"

hashmap-util = "org.plumelib:hashmap-util:2.0.0"

javac-parse = "org.plumelib:javac-parse:1.0.0"

javax-servlet-api = "javax.servlet:javax.servlet-api:4.0.1"

jgit-jgit = { group = "org.eclipse.jgit", name = "org.eclipse.jgit", version.ref = "jgit-version" }

jgit-ssh-apache = { group = "org.eclipse.jgit", name = "org.eclipse.jgit.ssh.apache", version.ref = "jgit-version" }

junit = { group = "junit", name = "junit", version.ref = "junit-junit" }

lombok = "org.projectlombok:lombok:1.18.46"

options = "org.plumelib:options:3.0.0"

plume-util = "org.plumelib:plume-util:2.0.0"

reflection-util = "org.plumelib:reflection-util:2.0.0"

require-javadoc = "org.plumelib:require-javadoc:3.0.0"

stubparser = "org.checkerframework:stubparser:3.28.1"

[plugins]

com-gradleup-shadow = { id = "com.gradleup.shadow", version = "9.6.1" }

de-undercouch-download = { id = "de.undercouch.download", version = "5.7.0" }

net-ltgt-errorprone = { id = "net.ltgt.errorprone", version = "5.1.0" }

com-diffplug-spotless = { id = "com.diffplug.spotless", version = "8.10.0" }

com-gorylenko-gradle-git-properties = { id = "com.gorylenko.gradle-git-properties", version = "4.0.1" }

biz-aqute-bnd-builder = { id = "biz.aQute.bnd.builder", version = "7.4.0" }

gradle-nexus-publish-plugin = { id = "io.github.gradle-nexus.publish-plugin", version = "2.0.0" }
