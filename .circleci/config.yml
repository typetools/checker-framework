version: 2.1

jobs:

  # Only proceed to other jobs if canary_jobs passes.
  canary_jobs:
    docker:
      - image: 'cimg/base:2026.09'
    resource_class: small
    environment:
      TERM: dumb
    steps:
      - run: /bin/true

  # Passes only if all other jobs passed.
  all_green:
    docker:
      - image: 'cimg/base:2026.09'
    resource_class: small
    environment:
      TERM: dumb
    steps:
      - run: /bin/true

  ci_info:
    docker:
      - image: 'mdernst/cf-ubuntu-jdk25-plus'
    resource_class: small
    environment:
      TERM: dumb
    steps:
      - restore_cache:
          keys:
            - &sourcefull-cache source-v1full-{{ .Branch }}-{{ .Revision }}
            - 'source-v1full-{{ .Branch }}-'
            - source-v1full-
      - checkout:
          method: full
      - save_cache:
          key: *sourcefull-cache
          paths:
            - .git
      - run:
          name: clone_plume_scripts
          command: ./checker/bin-devel/clone-plume-scripts.sh
      - run:
          name: set-ci-org-and-branch
          command: |
            # PLUME_SCRIPTS is the documented way to tell these scripts where they live.
            PLUME_SCRIPTS=./checker/bin-devel/.plume-scripts
            CI_DEBUG=1
            . "$PLUME_SCRIPTS"/set-ci-org-and-branch
      - run:
          name: set-git-range
          command: |
            # The sourced script reads PLUME_SCRIPTS, to find set-ci-org-and-branch.
            PLUME_SCRIPTS=./checker/bin-devel/.plume-scripts
            CI_DEBUG=1
            . "$PLUME_SCRIPTS"/set-git-range

  junit_jdk17:
    docker:
      - image: 'mdernst/cf-ubuntu-jdk17'
    resource_class: large
    environment:
      TERM: dumb
    steps:
      - run:
          name: halt-if-superseded
          command: |
            if test -n "${CIRCLE_BRANCH:-}"; then
              tip=$(git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 ls-remote "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git" "refs/heads/${CIRCLE_BRANCH}" | cut -f1) || true
              if test -n "$tip" && test "$tip" != "$CIRCLE_SHA1"; then
                echo "Superseded: ${CIRCLE_BRANCH} is now at ${tip}, not ${CIRCLE_SHA1}."
                if test -n "${CIRCLE_TOKEN:-}" \
                    && wget -q -O /dev/null --post-data= --header="Circle-Token: ${CIRCLE_TOKEN}" \
                      "https://circleci.com/api/v2/workflow/${CIRCLE_WORKFLOW_ID}/cancel"; then
                  echo "Canceled workflow ${CIRCLE_WORKFLOW_ID}; waiting for the cancellation to stop this job."
                  sleep 120
                fi
                echo "Halting without testing ${CIRCLE_SHA1}; its green status does not mean it passed."
                circleci-agent step halt
              fi
            fi
      - restore_cache:
          keys:
            - &source-cache source-v1-{{ .Branch }}-{{ .Revision }}
            - 'source-v1-{{ .Branch }}-'
            - source-v1-
      - checkout
      - save_cache:
          key: *source-cache
          paths:
            - .git
      - run:
          name: Compute Gradle cache key
          command: >-
            cat gradle/wrapper/gradle-wrapper.properties gradle/libs.versions.toml
            buildSrc/build.gradle docs/examples/errorprone/build.gradle
            docs/examples/lombok/build.gradle > /tmp/gradle-cache-key
      - restore_cache:
          keys:
            - &gradle-cache 'gradle-v1-{{ .Environment.CIRCLE_JOB }}-{{ checksum "/tmp/gradle-cache-key" }}'
            - 'gradle-v1-{{ .Environment.CIRCLE_JOB }}-'
            - gradle-v1-
      - run:
          name: test-cftests-junit.sh
          command: ./checker/bin-devel/test-cftests-junit.sh
          no_output_timeout: "30m"
          environment:
            ORG_GRADLE_PROJECT_jdkTestVersion: 17
      - run:
          name: Prune Gradle cache
          command: |
            find ~/.gradle/caches -name '*.lock' -delete || true
            rm -f ~/.gradle/caches/modules-2/gc.properties
      - save_cache:
          key: *gradle-cache
          paths:
            - ~/.gradle/caches/modules-2
            - ~/.gradle/wrapper

