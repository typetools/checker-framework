version: 2.1

jobs:

  # Only proceed to other jobs if canary_jobs passes.
  canary_jobs:
    docker:
      - image: 'cimg/base:2026.09'
    resource_class: small
    environment:
      TERM: dumb
    steps:
      - run: /bin/true

  # Passes only if all other jobs passed.
  all_green:
    docker:
      - image: 'cimg/base:2026.09'
    resource_class: small
    environment:
      TERM: dumb
    steps:
      - run: /bin/true

  ci_info:
    docker:
      - image: 'mdernst/cf-ubuntu-jdk25-plus'
    resource_class: small
    environment:
      TERM: dumb
    steps:
      - restore_cache:
          keys:
            - &sourcefull-cache source-v1full-{{ .Branch }}-{{ .Revision }}
            - 'source-v1full-{{ .Branch }}-'
            - source-v1full-
      - checkout:
          method: full
      - save_cache:
          key: *sourcefull-cache
          paths:
            - .git
      - run:
          name: Compute Gradle cache key
          command: >-
            cat gradle/wrapper/gradle-wrapper.properties gradle/libs.versions.toml
            buildSrc/build.gradle docs/examples/errorprone/build.gradle
            docs/examples/lombok/build.gradle > /tmp/gradle-cache-key
      - restore_cache:
          keys:
            - &gradle-cache 'gradle-v1-{{ .Environment.CIRCLE_JOB }}-{{ checksum "/tmp/gradle-cache-key" }}'
            - 'gradle-v1-{{ .Environment.CIRCLE_JOB }}-'
            - gradle-v1-
      - run:
          name: getPlumeScripts
          command: ./gradlew -q getPlumeScripts
      - run:
          name: Prune Gradle cache
          command: |
            find ~/.gradle/caches -name '*.lock' -delete || true
            rm -f ~/.gradle/caches/modules-2/gc.properties
      - save_cache:
          key: *gradle-cache
          paths:
            - ~/.gradle/caches/modules-2
            - ~/.gradle/wrapper
      - run:
          name: ci-org-and-branch
          command: ./checker/bin-devel/.plume-scripts/ci-org-and-branch --debug
      - run:
          name: git-changes
          command: ./checker/bin-devel/.plume-scripts/git-changes --debug

