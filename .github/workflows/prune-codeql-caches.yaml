# Delete the CodeQL caches that nothing can reach any more.
#
# CodeQL looks up both of its caches by restore key, which is a key prefix:
#
#   Looking in Actions cache for overlay-base database with restore key
#     codeql-overlay-base-database-1-<confighash>-java-<codeqlversion>-
#   Downloading cache for java with key codeql-dependencies-1-Linux-java-<hash>
#     and restore keys codeql-dependencies-
#
# A restore key selects the most recently created cache that it matches, so
# only the newest cache of each kind is ever read.  The older ones are
# unreachable, and deleting them therefore costs nothing.
#
# They accumulate because the key that CodeQL saves under is not the key that
# it looks up.  It computes the lookup key before extraction and the save key
# after, and the Gradle build writes files that the key's hash covers, so the
# two differ.  Every analysis thus stores about 1GB that no later analysis can
# find by its primary key.  A day of them crowds every other cache out of the
# repository's 10GB quota, whereupon GitHub evicts caches that are in use.
name: Prune CodeQL caches

"on":
  schedule:
    # Daily.  CodeQL adds about 1GB per analysis, so a single day's
    # accumulation is already a large fraction of the quota.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted, without deleting it.
        type: boolean
        default: false

permissions:
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete every CodeQL cache but the newest of each kind
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${GH_REPO}/actions/caches?per_page=100" \
            --jq '.actions_caches[]' > "${RUNNER_TEMP}/caches.jsonl"
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import subprocess

          # A cache is reachable only if it is the newest one whose key matches
          # the restore key that CodeQL looks it up by.  Each pattern captures
          # that restore key; what follows it varies from one run to the next.
          FAMILIES = [
              re.compile(r"^(codeql-dependencies-.*-)[0-9a-f]{64}$"),
              re.compile(
                  r"^(codeql-overlay-base-database-.*-[0-9.]+-)[0-9a-f]{40}-\d+-\d+$"
              ),
          ]

          def restore_key(key):
              """Return the restore key that selects KEY, or None if unrecognized."""
              for family in FAMILIES:
                  match = family.match(key)
                  if match:
                      return match.group(1)
              return None

          repo = os.environ["GH_REPO"]
          dry_run = os.environ.get("DRY_RUN") == "true"

          newest = {}
          doomed = []
          with open(os.path.join(os.environ["RUNNER_TEMP"], "caches.jsonl")) as caches:
              for line in caches:
                  line = line.strip()
                  if not line:
                      continue
                  cache = json.loads(line)
                  key = restore_key(cache["key"])
                  # An unrecognized key shape might be reachable, so leave it.
                  if key is None:
                      continue
                  # A cache is scoped to the ref that wrote it, so the newest
                  # cache of a family on one ref does not shadow another ref's.
                  group = (cache["ref"], key)
                  previous = newest.get(group)
                  if previous is None or cache["created_at"] > previous["created_at"]:
                      if previous is not None:
                          doomed.append(previous)
                      newest[group] = cache
                  else:
                      doomed.append(cache)

          for cache in sorted(newest.values(), key=lambda c: c["key"]):
              print("keep          {:8.0f} MB  {}".format(
                  cache["size_in_bytes"] / 1e6, cache["key"]))

          freed = 0
          verb = "would delete" if dry_run else "delete      "
          for cache in sorted(doomed, key=lambda c: c["key"]):
              freed += cache["size_in_bytes"]
              print("{} {:8.0f} MB  {}".format(
                  verb, cache["size_in_bytes"] / 1e6, cache["key"]))
              if not dry_run:
                  subprocess.run(
                      ["gh", "api", "-X", "DELETE", "--silent",
                       "repos/{}/actions/caches/{}".format(repo, cache["id"])],
                      check=True)

          print("{} caches, {:.2f} GB".format(len(doomed), freed / 1e9))
          PYTHON
