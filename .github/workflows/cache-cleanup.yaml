# Delete the Actions caches that a pull request created, as soon as it closes.
# Caches count against a repository-wide 10GB quota, and GitHub evicts the
# least recently used cache once that is exceeded, so a closed pull request's
# caches would otherwise evict caches that are still in use.
name: Cache cleanup

# "pull_request_target" rather than "pull_request", because under
# "pull_request" a pull request from a fork gets a read-only token, which
# cannot delete a cache.  This workflow runs no code from the pull request,
# which is what makes "pull_request_target" safe here.
"on":
  pull_request_target:
    types:
      - closed

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete the caches of the closed pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          THIS_REPO: ${{ github.repository }}
        run: |
          refs="refs/pull/${PR_NUMBER}/merge"
          # A pull request from a branch of this repository also ran the "push"
          # trigger, under the branch's own ref, and so has a second set of
          # caches.
          if [ "$HEAD_REPO" = "$THIS_REPO" ]; then
            refs="$refs refs/heads/${HEAD_REF}"
          fi
          for ref in $refs; do
            echo "Deleting the caches of $ref"
            ids="$(gh cache list --ref "$ref" --limit 100 --json id --jq '.[].id' || true)"
            for id in $ids; do
              gh cache delete "$id" || true
            done
          done
