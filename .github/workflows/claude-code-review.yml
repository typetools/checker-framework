name: Claude Code Review

# Use "pull_request_target:" rather than "pull_request:".  GitHub withholds
# secrets and downgrades the GITHUB_TOKEN to read-only for "pull_request:" runs
# that originate from a fork, so the action cannot obtain an OIDC token and has
# no API key.  "pull_request_target:" runs in the context of the base
# repository, which has both.
"on":
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # "pull_request_target:" exposes the base repository's secrets to a job that
    # examines pull request code, so run only for trusted authors.
    if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)

    runs-on: ubuntu-latest
    permissions:
      contents: read # Claude cannot push or merge; it can only comment.
      # To post the review.  Note that on a pull request from a fork, GitHub
      # issues a read-only token no matter what this block requests, so Claude
      # cannot post a review on a fork's pull request.
      pull-requests: write
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # "pull_request_target:" checks out the base branch by default; check
          # out the pull request's code instead, which is what is under review.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Pass a GitHub token explicitly.  Otherwise the action trades the
          # workflow's OIDC token for a Claude GitHub App token, and Anthropic's
          # exchange endpoint rejects OIDC tokens whose "event_name" claim is
          # "pull_request_target", failing with "401 Unauthorized - Invalid OIDC
          # token".  (See anthropics/claude-code-action issue 713.)  Supplying
          # "github_token" skips the exchange.  A consequence is that review
          # comments come from "github-actions[bot]" rather than "claude[bot]".
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Enable progress tracking
          # When track_progress is enabled:
          # - Creates a tracking comment with progress checkboxes
          # - Includes all PR context (comments, attachments, images)
          # - Updates progress as the review proceeds
          # - Marks as completed when done
          track_progress: true

          # Supplying "prompt" selects the action's automation mode, which
          # reviews every pull request as soon as the workflow runs.  Without
          # "prompt" the action selects interactive mode, which does nothing
          # until someone writes "@claude" in a comment, and reports "No trigger
          # found, skipping remaining steps".
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request.

            Report specific problems as inline comments.  Use a top-level
            comment for general observations.  Do not restate what the diff
            does, and do not raise stylistic preferences that the repository's
            linters already enforce.

          # Tools for comprehensive PR review
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr *)"
