unmodparam.location=@UnmodifiableParam may only be written within the type of a formal parameter of a method, constructor, or lambda expression, including the receiver parameter
preservesmodifiability.location=@PreservesModifiability may only be written on a method declaration that has exactly one formal parameter, which is not a varargs parameter, and a non-void result
inconsistent.constructor.result.type=Constructor result type %s is inconsistent with a previous constructor with result type %s
bottom.annotation.on.receiver=Do not write the bottom annotation on a receiver
method.implementation.is.uoe=Method implementation should not be `throw new UnsupportedOperationException()`, because the constructors of this class are %s
method.implementation.not.uoe=Method implementation should be `throw new UnsupportedOperationException()`, because the constructors of this class are %s
inherited.implementation.uoe=The implementation of %s that this class inherits from %s throws UnsupportedOperationException, but the constructors of this class are %s.  Override the method, or change the constructor annotation.
throwsuoe.implementation.not.uoe=The implementation of a method annotated @ThrowsUnsupportedOperation must be `throw new UnsupportedOperationException()`
