unfulfilled.collection.obligations=@MustCall %s may not have been invoked on the elements of %s.%nReason for going out of scope: %s
unfulfilled.field.obligations=The field %s may not have all of its @MustCall %s called on its elements.%nReason for failure of proving fulfillment: %s
transfer.owningcollection.field.ownership=Method invocation unsafely transfers the ownership away from field %s. An @OwningCollection field can never lose ownership.
transfer.owningcollection.multiple=The collection %s is passed to more than one owning parameter of %s, but a collection can have only one owner.
illegal.type.annotation=Users may not write %s.
static.resource.collection.field=The static field %s is unsoundly treated as non-static.
illegal.collection.mutator.owning.insert.into.notowning=Call to %s is not allowed on a @NotOwningCollection receiver when the inserted value may be owning: %s
collection.obligation.never.enforced=@MustCall method %s may never be invoked on the elements of %s because control cannot reach a method exit after this point.
creates.collection.obligation.element=@CreatesCollectionObligation on %s inserts parameter %s, which does not have the collection's element type %s. Name the inserted parameter with @CreatesCollectionObligation(element = "#N").
creates.collection.obligation.element.missing=@CreatesCollectionObligation on %s inserts %s, but the method has no such parameter. Write the inserted parameter as "#1", "#2", and so on.
